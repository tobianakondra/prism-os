name: ci
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly is required by the `bootloader` crate (unstable -Z flags
      # for its BIOS/UEFI stages). See rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, llvm-tools
          targets: x86_64-unknown-none
      - name: Format
        run: cargo fmt --check
      - name: Clippy host + core (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy kernel freestanding (deny warnings)
        run: cargo clippy -p kernel --target x86_64-unknown-none -- -D warnings
      - name: Host unit tests (prism-core + host tool)
        run: cargo test
      - name: Freestanding kernel build
        run: cargo build -p kernel --target x86_64-unknown-none
      - name: Build boot images
        run: cargo run -- build
