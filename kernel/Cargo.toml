[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
description = "PrismOS kernel: minimal UEFI-booted kernel. Thin hardware wiring over prism-core logic; never host-tested (bare-metal _start)."
# The kernel binary carries the bootloader `entry_point!` (_start symbol)
# and privileged instructions: it can ONLY link for x86_64-unknown-none.
# `test = false` stops `cargo test` from building it for the host (which
# would fail at link time with `duplicate symbol: _start`). Logic is tested
# via the `prism-core` library instead. See ARCHITECTURE.md.
autotests = false

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false

[dependencies]
bootloader_api = "0.11"
prism-core = { path = "../prism-core" }
# Minimal x86_64 features ON PURPOSE.
# Default features enable `nightly` -> `step_trait`, whose `Step` impls are
# currently broken on recent nightlies (missing forward/backward_overflowing).
# We enable ONLY what Phase 2 needs:
#   - `instructions`       : `hlt`, `int3` (halt + breakpoint self-test).
#   - `abi_x86_interrupt`  : `extern "x86-interrupt"` calling convention for
#     IDT handlers. Enabled WITHOUT the `nightly` umbrella so the broken
#     `step_trait` impls stay compiled out. Verified: `cargo info x86_64`
#     lists `abi_x86_interrupt` as an independent feature.
x86_64 = { version = "0.14", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
uart_16550 = "0.3"
spin = "0.9"
# Classic 8259 PIC driver (same rust-osdev family as the other crates).
# 0.11 pairs with x86_64 0.14. Used for PIC remap + timer IRQ + EOIs.
pic8259 = "0.11"
# Raw x86 port I/O for the PIT bring-up (`outb` to fixed PC ports).
# Already a transitive dependency via uart_16550; declared directly because
# `pit.rs` uses it. Same 0.52 line the ecosystem pins.
x86 = "0.52"
